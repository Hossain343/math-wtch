name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - run: flutter create . --platforms=android

      # اسم واقعی اپ روی گوشی
      - run: sed -i 's/android:label="[^"]*"/android:label="math-and"/' android/app/src/main/AndroidManifest.xml

      # ساخت APK
      - run: flutter build apk --release

      # نام فایل APK خروجی را به app-release1.apk تغییر بده
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: math-and-apk
          path: build/app/outputs/flutter-apk/app-release1.apk
